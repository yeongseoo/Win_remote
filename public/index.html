<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Web Remote Desktop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 접속 정보 입력 화면 -->
<main id="login-view" class="login-view">
    <form id="login-form" class="card" autocomplete="on">
        <h1>웹 원격 데스크톱</h1>
        <p class="sub">브라우저에서 바로 Windows PC에 원격 접속합니다. 대상 PC에는 별도 프로그램 설치가 필요 없습니다.</p>

        <div class="row">
            <label class="grow">호스트 (IP 또는 도메인)
                <input name="hostname" required placeholder="192.168.0.10" autocomplete="off">
            </label>
            <label class="port">포트
                <input name="port" type="number" min="1" max="65535" value="3389">
            </label>
        </div>

        <label>사용자 이름
            <input name="username" placeholder="Administrator" autocomplete="username">
        </label>
        <label>비밀번호
            <input name="password" type="password" autocomplete="current-password">
        </label>

        <details>
            <summary>고급 설정</summary>
            <label>도메인
                <input name="domain" placeholder="(선택)">
            </label>
            <div class="row">
                <label class="grow">보안 모드
                    <select name="security">
                        <option value="any">자동 (any)</option>
                        <option value="nla">NLA</option>
                        <option value="tls">TLS</option>
                        <option value="rdp">RDP 표준</option>
                    </select>
                </label>
                <label class="grow">색상
                    <select name="colorDepth">
                        <option value="32">32비트</option>
                        <option value="24" selected>24비트</option>
                        <option value="16">16비트 (저대역폭)</option>
                    </select>
                </label>
            </div>
            <label>원격 PC 키보드 배열
                <select name="keyboardLayout">
                    <option value="en-us-qwerty">한국어/영어 (en-us-qwerty)</option>
                    <option value="ja-jp-qwerty">일본어</option>
                    <option value="en-gb-qwerty">영국</option>
                    <option value="de-de-qwertz">독일</option>
                    <option value="fr-fr-azerty">프랑스</option>
                    <option value="failsafe">Failsafe (유니코드)</option>
                </select>
            </label>
            <label class="check"><input type="checkbox" name="ignoreCert" checked> 인증서 오류 무시</label>
            <label class="check"><input type="checkbox" name="enableAudio" checked> 소리 재생</label>
            <label class="check"><input type="checkbox" name="enableWallpaper"> 배경화면 표시</label>
        </details>

        <label id="access-password-field" class="hidden">서비스 접근 비밀번호
            <input name="accessPassword" type="password" autocomplete="off">
        </label>

        <label class="check"><input type="checkbox" name="remember"> 이 브라우저에 접속 정보 기억 (비밀번호 제외)</label>

        <p id="login-error" class="error" role="alert"></p>
        <button type="submit" id="connect-btn">연결</button>
    </form>
</main>

<!-- 원격 화면 -->
<section id="session-view" class="session-view hidden">
    <div id="toolbar" class="toolbar">
        <span id="status" class="status">연결 중…</span>
        <button data-action="cad" title="Ctrl+Alt+Del 전송">Ctrl+Alt+Del</button>
        <button data-action="winkey" title="Windows 키 전송">⊞ Win</button>
        <button data-action="hangul" title="한/영 전환 (오른쪽 Alt 전송)">한/영</button>
        <button data-action="clipboard" title="클립보드 보내기/받기">클립보드</button>
        <button data-action="fullscreen" title="전체 화면">전체화면</button>
        <button data-action="disconnect" class="danger">연결 끊기</button>
    </div>
    <div id="display-wrap" class="display-wrap" tabindex="0"></div>

    <dialog id="clipboard-dialog">
        <form method="dialog">
            <h3>클립보드</h3>
            <p class="sub">원격 PC에서 복사한 텍스트가 여기에 표시됩니다. 수정 후 "보내기"를 누르면 원격 PC 클립보드로 전송됩니다.</p>
            <textarea id="clipboard-text" rows="8"></textarea>
            <div class="row end">
                <button value="cancel" class="secondary">닫기</button>
                <button value="send" id="clipboard-send">보내기</button>
            </div>
        </form>
    </dialog>
</section>

<script src="vendor/guacamole-common.js"></script>
<script src="app.js"></script>
</body>
</html>
